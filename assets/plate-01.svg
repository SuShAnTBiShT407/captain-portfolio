<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1424"/>
      <stop offset="100%" stop-color="#1a2c44"/>
    </linearGradient>
    <radialGradient id="lamp1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(243,211,108,.85)"/>
      <stop offset="60%" stop-color="rgba(230,194,94,.2)"/>
      <stop offset="100%" stop-color="rgba(230,194,94,0)"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg1)"/>
  <!-- window with night sky -->
  <rect x="20" y="20" width="140" height="160" fill="#070d18" stroke="#2a3a52" stroke-width="2"/>
  <line x1="90" y1="20" x2="90" y2="180" stroke="#2a3a52" stroke-width="2"/>
  <line x1="20" y1="100" x2="160" y2="100" stroke="#2a3a52" stroke-width="2"/>
  <!-- stars in window -->
  <g fill="#f3e6c3">
    <circle cx="45" cy="55" r="1.2"/><circle cx="70" cy="38" r="0.8"/>
    <circle cx="115" cy="62" r="1"/><circle cx="140" cy="48" r="1.4"/>
    <circle cx="50" cy="130" r="1"/><circle cx="125" cy="142" r="1.3"/>
    <circle cx="80" cy="155" r="0.7"/>
  </g>
  <!-- lamp glow on desk -->
  <ellipse cx="280" cy="160" rx="140" ry="60" fill="url(#lamp1)"/>
  <!-- desk -->
  <rect x="0" y="220" width="400" height="80" fill="#2c1a09"/>
  <line x1="0" y1="226" x2="400" y2="226" fill="none" stroke="rgba(255,210,140,.15)" stroke-width="2"/>
  <!-- laptop -->
  <rect x="220" y="170" width="140" height="80" rx="4" fill="#0d1626" stroke="#2a3a52" stroke-width="2"/>
  <rect x="226" y="176" width="128" height="62" fill="#04080f"/>
  <!-- code lines on laptop -->
  <g font-family="monospace" font-size="6">
    <text x="232" y="186" fill="#5fc7c2">const ship = sail()</text>
    <text x="232" y="196" fill="#e6c25e">  await crew.ready()</text>
    <text x="232" y="206" fill="#cbb98c">  return horizon</text>
    <text x="232" y="216" fill="#d05a3c">// chart the course</text>
    <text x="232" y="226" fill="#5fc7c2">export default ship</text>
  </g>
  <rect x="218" y="248" width="144" height="4" fill="#1a2c44"/>
  <!-- coffee mug -->
  <ellipse cx="100" cy="240" rx="20" ry="6" fill="#3a2913"/>
  <rect x="80" y="208" width="40" height="34" rx="3" fill="#5a3c1c" stroke="#1a0e07" stroke-width="1.5"/>
  <ellipse cx="100" cy="210" rx="18" ry="4" fill="#2c1a09"/>
  <path d="M120 215 Q135 215 135 225 Q135 235 120 235" fill="none" stroke="#5a3c1c" stroke-width="3"/>
  <!-- steam -->
  <path d="M92 198 Q88 192 92 186 Q96 180 92 174" fill="none" stroke="rgba(243,230,195,.4)" stroke-width="1.5"/>
  <path d="M104 200 Q100 194 104 188" fill="none" stroke="rgba(243,230,195,.3)" stroke-width="1.5"/>
  <!-- border -->
  <rect x="6" y="6" width="388" height="288" fill="none" stroke="rgba(230,194,94,.4)" stroke-width="1"/>
</svg>
