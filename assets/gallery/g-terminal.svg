<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="tBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0b0e"/>
      <stop offset="100%" stop-color="#16181d"/>
    </linearGradient>
    <pattern id="tDots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="rgba(187,255,102,.07)"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="url(#tBg)"/>
  <rect width="600" height="600" fill="url(#tDots)"/>

  <!-- terminal window -->
  <g transform="translate(50 80)">
    <rect x="2" y="6" width="500" height="450" rx="14" fill="rgba(0,0,0,.6)"/>
    <rect width="500" height="450" rx="14" fill="#0e1014" stroke="#22252c" stroke-width="1.5"/>
    <!-- title bar -->
    <rect width="500" height="44" rx="14" fill="#16181d"/>
    <rect y="34" width="500" height="10" fill="#16181d"/>
    <line x1="0" y1="44" x2="500" y2="44" stroke="#22252c" stroke-width="1"/>
    <circle cx="22" cy="22" r="7" fill="#ff5f57"/>
    <circle cx="44" cy="22" r="7" fill="#ffbd2e"/>
    <circle cx="66" cy="22" r="7" fill="#28c840"/>
    <text x="250" y="27" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle" fill="#7a7d85">sushant@portfolio: ~</text>

    <!-- code -->
    <g font-family="JetBrains Mono, monospace" font-size="14" transform="translate(20 70)">
      <text fill="#bbff66" font-weight="700">sushant@portfolio</text>
      <text x="158" fill="#4a4d55">~</text>
      <text x="170" fill="#bbff66">❯</text>
      <text x="185" fill="#e8e9ec">whoami</text>
      <text y="24" fill="#7a7d85">Sushant Bisht — Full-Stack Engineer</text>
      <text y="60" fill="#bbff66" font-weight="700">sushant@portfolio</text>
      <text y="60" x="158" fill="#4a4d55">~</text>
      <text y="60" x="170" fill="#bbff66">❯</text>
      <text y="60" x="185" fill="#e8e9ec">git status</text>
      <text y="84" fill="#5fa8ff">On branch </text>
      <text y="84" x="80" fill="#bbff66">main</text>
      <text y="108" fill="#7a7d85">nothing to commit, working tree clean</text>
      <text y="144" fill="#bbff66" font-weight="700">sushant@portfolio</text>
      <text y="144" x="158" fill="#4a4d55">~</text>
      <text y="144" x="170" fill="#bbff66">❯</text>
      <text y="144" x="185" fill="#e8e9ec">./ship.sh</text>
      <text y="168" fill="#ffd966">○ building...</text>
      <text y="192" fill="#ffd966">○ optimizing...</text>
      <text y="216" fill="#bbff66">✓ deployed in 8s</text>
      <text y="252" fill="#bbff66">✓ live at portfolio.vercel.app</text>
      <text y="288" fill="#bbff66" font-weight="700">sushant@portfolio</text>
      <text y="288" x="158" fill="#4a4d55">~</text>
      <text y="288" x="170" fill="#bbff66">❯</text>
      <text y="288" x="185" fill="#e8e9ec">_</text>
    </g>
  </g>

  <!-- corner label -->
  <text x="40" y="40" font-family="JetBrains Mono, monospace" font-size="11" fill="#bbff66" font-weight="700">// ship something today</text>
  <text x="40" y="568" font-family="JetBrains Mono, monospace" font-size="9" fill="#7a7d85">perfection ships nothing</text>
</svg>
