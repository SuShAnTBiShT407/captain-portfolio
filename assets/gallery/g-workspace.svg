<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="wsBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0b0e"/>
      <stop offset="100%" stop-color="#16181d"/>
    </linearGradient>
    <radialGradient id="wsLamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,217,102,.5)"/>
      <stop offset="60%" stop-color="rgba(255,217,102,.08)"/>
      <stop offset="100%" stop-color="rgba(255,217,102,0)"/>
    </radialGradient>
    <linearGradient id="wsMonitor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1d23"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#wsBg)"/>

  <!-- back wall: window with stars -->
  <rect x="30" y="30" width="180" height="200" fill="#04060c" stroke="#1a1d23" stroke-width="2"/>
  <line x1="120" y1="30" x2="120" y2="230" stroke="#1a1d23" stroke-width="2"/>
  <line x1="30" y1="130" x2="210" y2="130" stroke="#1a1d23" stroke-width="2"/>
  <g fill="#e8e9ec">
    <circle cx="55" cy="60" r="1.4"/><circle cx="90" cy="45" r="1"/>
    <circle cx="150" cy="70" r="1.6"/><circle cx="180" cy="55" r="1.2"/>
    <circle cx="60" cy="160" r="1.1"/><circle cx="170" cy="175" r="1.3"/>
    <circle cx="100" cy="190" r="0.9"/><circle cx="190" cy="205" r="1.2"/>
  </g>
  <!-- moon -->
  <circle cx="170" cy="80" r="14" fill="#cbb98c" opacity="0.7"/>
  <circle cx="174" cy="76" r="10" fill="#04060c" opacity="0.4"/>

  <!-- lamp glow -->
  <ellipse cx="380" cy="280" rx="240" ry="100" fill="url(#wsLamp)"/>

  <!-- desk surface -->
  <rect x="0" y="300" width="600" height="100" fill="#2c1a09"/>
  <line x1="0" y1="306" x2="600" y2="306" stroke="rgba(255,210,140,.18)" stroke-width="2"/>

  <!-- monitor -->
  <g transform="translate(300 130)">
    <rect x="-130" y="0" width="260" height="160" rx="6" fill="url(#wsMonitor)" stroke="#22252c" stroke-width="2"/>
    <rect x="-122" y="8" width="244" height="144" fill="#0a0b0e"/>
    <!-- code lines -->
    <g font-family="JetBrains Mono, monospace" font-size="9">
      <text x="-114" y="26" fill="#bbff66">$ git log --oneline</text>
      <text x="-114" y="40" fill="#7a7d85">feat: ship the new flow</text>
      <text x="-114" y="54" fill="#7a7d85">fix: race in retry queue</text>
      <text x="-114" y="68" fill="#7a7d85">chore: bump deps</text>
      <text x="-114" y="82" fill="#7a7d85">docs: add architecture</text>
      <text x="-114" y="96" fill="#e8e9ec">$ </text>
      <text x="-110" y="96" fill="#bbff66">npm run dev</text>
      <text x="-114" y="110" fill="#5fa8ff">▲ ready on :3000</text>
      <text x="-114" y="124" fill="#ffd966">○ compiling...</text>
      <text x="-114" y="138" fill="#bbff66">✓ compiled in 482ms</text>
    </g>
    <!-- stand -->
    <rect x="-30" y="160" width="60" height="10" fill="#1a1d23"/>
    <rect x="-50" y="170" width="100" height="6" rx="3" fill="#16181d"/>
  </g>

  <!-- coffee mug -->
  <g transform="translate(130 320)">
    <ellipse cx="0" cy="40" rx="28" ry="8" fill="rgba(0,0,0,.4)"/>
    <rect x="-22" y="-10" width="44" height="50" rx="4" fill="#bbff66"/>
    <ellipse cx="0" cy="-10" rx="22" ry="6" fill="#2c1a09"/>
    <path d="M 22 5 Q 38 5 38 20 Q 38 35 22 35" fill="none" stroke="#bbff66" stroke-width="4"/>
    <!-- steam -->
    <path d="M -8 -22 Q -12 -32 -8 -42 Q -4 -52 -8 -62" fill="none" stroke="rgba(232,233,236,.4)" stroke-width="2"/>
    <path d="M 6 -22 Q 2 -32 6 -42" fill="none" stroke="rgba(232,233,236,.3)" stroke-width="2"/>
  </g>

  <!-- keyboard -->
  <g transform="translate(300 320)">
    <rect x="-120" y="0" width="240" height="40" rx="4" fill="#16181d" stroke="#22252c" stroke-width="1"/>
    <g fill="#0a0b0e">
      <rect x="-114" y="6" width="14" height="14" rx="2"/>
      <rect x="-96" y="6" width="14" height="14" rx="2"/>
      <rect x="-78" y="6" width="14" height="14" rx="2"/>
      <rect x="-60" y="6" width="14" height="14" rx="2"/>
      <rect x="-42" y="6" width="14" height="14" rx="2"/>
      <rect x="-24" y="6" width="14" height="14" rx="2"/>
      <rect x="-6" y="6" width="14" height="14" rx="2"/>
      <rect x="12" y="6" width="14" height="14" rx="2"/>
      <rect x="30" y="6" width="14" height="14" rx="2"/>
      <rect x="48" y="6" width="14" height="14" rx="2"/>
      <rect x="66" y="6" width="14" height="14" rx="2"/>
      <rect x="84" y="6" width="14" height="14" rx="2"/>
      <rect x="102" y="6" width="14" height="14" rx="2"/>
      <rect x="-80" y="24" width="160" height="10" rx="2"/>
    </g>
  </g>

  <!-- plant -->
  <g transform="translate(500 280)">
    <rect x="-18" y="20" width="36" height="22" fill="#5a3c1c"/>
    <ellipse cx="-12" cy="6" rx="10" ry="22" fill="#28c840" transform="rotate(-18 -12 6)"/>
    <ellipse cx="6" cy="0" rx="11" ry="26" fill="#1f9c30" transform="rotate(8 6 0)"/>
    <ellipse cx="16" cy="14" rx="9" ry="20" fill="#28c840" transform="rotate(22 16 14)"/>
  </g>

  <!-- dot grid overlay -->
  <g opacity="0.12">
    <pattern id="gdot" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#bbff66"/>
    </pattern>
    <rect width="600" height="400" fill="url(#gdot)"/>
  </g>
</svg>
