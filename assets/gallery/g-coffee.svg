<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="cBg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0805"/>
    </radialGradient>
    <radialGradient id="cMug" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3a2913"/>
      <stop offset="100%" stop-color="#1a0e07"/>
    </radialGradient>
    <radialGradient id="cFoam" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e8d5a8"/>
      <stop offset="80%" stop-color="#a17b1d"/>
      <stop offset="100%" stop-color="#5a3c1c"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#cBg)"/>

  <!-- table planks -->
  <g opacity="0.5">
    <line x1="0" y1="430" x2="600" y2="430" stroke="#2c1a09" stroke-width="2"/>
    <line x1="0" y1="500" x2="600" y2="500" stroke="#2c1a09" stroke-width="2"/>
    <line x1="160" y1="380" x2="160" y2="600" stroke="#1a0e07" stroke-width="1.5"/>
    <line x1="320" y1="380" x2="320" y2="600" stroke="#1a0e07" stroke-width="1.5"/>
    <line x1="480" y1="380" x2="480" y2="600" stroke="#1a0e07" stroke-width="1.5"/>
  </g>

  <!-- shadow -->
  <ellipse cx="300" cy="460" rx="180" ry="22" fill="rgba(0,0,0,.6)"/>

  <!-- mug top ellipse -->
  <ellipse cx="300" cy="220" rx="150" ry="40" fill="url(#cFoam)"/>
  <!-- foam pattern (latte art swirl) -->
  <path d="M 220 220 Q 240 200 260 220 T 300 220 Q 320 200 340 220 T 380 220"
    fill="none" stroke="#3a2913" stroke-width="3" opacity="0.5"/>
  <ellipse cx="300" cy="220" rx="140" ry="34" fill="none" stroke="#3a2913" stroke-width="2"/>

  <!-- mug body -->
  <path d="M 150 220 Q 150 460 200 460 L 400 460 Q 450 460 450 220" fill="url(#cMug)"/>
  <ellipse cx="300" cy="220" rx="150" ry="40" fill="none" stroke="#5a3c1c" stroke-width="3"/>

  <!-- handle -->
  <path d="M 450 250 Q 530 260 530 320 Q 530 380 450 390" fill="none" stroke="#3a2913" stroke-width="22"/>
  <path d="M 450 270 Q 510 280 510 320 Q 510 360 450 370" fill="none" stroke="url(#cMug)" stroke-width="14"/>

  <!-- steam wisps -->
  <g opacity="0.6">
    <path d="M 240 200 Q 220 170 240 140 Q 260 110 240 80" fill="none" stroke="#e8d5a8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 300 195 Q 280 165 300 135 Q 320 105 300 75" fill="none" stroke="#e8d5a8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 360 200 Q 340 170 360 140 Q 380 110 360 80" fill="none" stroke="#e8d5a8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- coffee beans scattered -->
  <g fill="#3a2913" stroke="#1a0e07" stroke-width="1">
    <ellipse cx="100" cy="500" rx="14" ry="9" transform="rotate(-20 100 500)"/>
    <line x1="92" y1="497" x2="108" y2="503" stroke="#1a0e07" stroke-width="1.5" transform="rotate(-20 100 500)"/>
    <ellipse cx="130" cy="530" rx="14" ry="9" transform="rotate(15 130 530)"/>
    <line x1="122" y1="527" x2="138" y2="533" stroke="#1a0e07" stroke-width="1.5" transform="rotate(15 130 530)"/>
    <ellipse cx="500" cy="510" rx="14" ry="9" transform="rotate(30 500 510)"/>
    <line x1="492" y1="507" x2="508" y2="513" stroke="#1a0e07" stroke-width="1.5" transform="rotate(30 500 510)"/>
  </g>

  <!-- caption -->
  <text x="300" y="560" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle" fill="#a17b1d">// fuel before PRs</text>
</svg>
