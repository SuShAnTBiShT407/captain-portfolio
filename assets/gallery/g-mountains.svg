<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="mSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0b0e"/>
      <stop offset="50%" stop-color="#1a2240"/>
      <stop offset="100%" stop-color="#2a3a52"/>
    </linearGradient>
    <radialGradient id="mMoon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(243,230,195,.9)"/>
      <stop offset="60%" stop-color="rgba(243,230,195,.2)"/>
      <stop offset="100%" stop-color="rgba(243,230,195,0)"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#mSky)"/>
  <!-- moon -->
  <circle cx="460" cy="140" r="80" fill="url(#mMoon)"/>
  <circle cx="460" cy="140" r="38" fill="#f3e6c3"/>
  <circle cx="470" cy="132" r="32" fill="rgba(15,26,44,.16)"/>
  <!-- stars -->
  <g fill="#f3e6c3">
    <circle cx="40" cy="60" r="1.5"/><circle cx="120" cy="90" r="1"/>
    <circle cx="200" cy="50" r="1.8"/><circle cx="280" cy="80" r="1.1"/>
    <circle cx="350" cy="50" r="1.3"/><circle cx="80" cy="160" r="1"/>
    <circle cx="540" cy="60" r="1.2"/><circle cx="510" cy="220" r="1.5"/>
    <circle cx="30" cy="240" r="1"/><circle cx="380" cy="160" r="1.1"/>
    <circle cx="250" cy="220" r="0.9"/><circle cx="180" cy="280" r="1.2"/>
    <circle cx="430" cy="290" r="0.8"/><circle cx="560" cy="300" r="1.1"/>
    <circle cx="100" cy="310" r="1.3"/>
  </g>
  <!-- shooting star -->
  <line x1="80" y1="60" x2="180" y2="100" stroke="#f3e6c3" stroke-width="1" opacity="0.55"/>
  <circle cx="180" cy="100" r="1.6" fill="#f3e6c3"/>
  <!-- distant mountains -->
  <polygon points="0,420 80,300 160,360 240,260 320,340 400,280 480,340 560,300 600,340 600,600 0,600"
    fill="#1a2c44" opacity="0.8"/>
  <!-- mid mountains -->
  <polygon points="0,470 100,360 200,440 320,340 420,420 500,360 600,440 600,600 0,600"
    fill="#0f1f33" opacity="0.95"/>
  <!-- front mountains -->
  <polygon points="0,530 120,420 240,490 360,400 480,470 600,420 600,600 0,600"
    fill="#08111e"/>
  <!-- foreground silhouette: figure on a ridge -->
  <g fill="#04060c">
    <ellipse cx="300" cy="500" rx="80" ry="10"/>
    <!-- person -->
    <circle cx="300" cy="442" r="8"/>
    <rect x="294" y="450" width="12" height="32" rx="2"/>
    <rect x="290" y="478" width="20" height="6"/>
  </g>
  <!-- tiny village lights -->
  <g fill="#ffd966">
    <rect x="120" y="496" width="2" height="3" opacity="0.8"/>
    <rect x="140" y="500" width="2" height="3" opacity="0.6"/>
    <rect x="180" y="492" width="2" height="3" opacity="0.7"/>
    <rect x="420" y="490" width="2" height="3" opacity="0.8"/>
    <rect x="450" y="500" width="2" height="3" opacity="0.6"/>
    <rect x="500" y="496" width="2" height="3" opacity="0.7"/>
  </g>
</svg>
