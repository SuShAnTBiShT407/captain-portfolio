<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1424"/>
      <stop offset="100%" stop-color="#08111e"/>
    </linearGradient>
    <radialGradient id="compassFace" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2c44"/>
      <stop offset="100%" stop-color="#04080f"/>
    </radialGradient>
    <linearGradient id="brass6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3d36c"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#7a5e0e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg6)"/>
  <!-- subtle parchment map texture under compass -->
  <g opacity="0.08" stroke="#e6c25e" stroke-width="0.6" fill="none">
    <path d="M40 60 Q120 80 200 60 T380 70"/>
    <path d="M30 110 Q90 130 180 110 T370 120"/>
    <path d="M40 200 Q130 180 220 210 T380 200"/>
    <path d="M20 250 Q100 240 200 260 T390 250"/>
  </g>
  <!-- compass -->
  <g transform="translate(200 150)">
    <!-- outer brass ring -->
    <circle r="110" fill="none" stroke="url(#brass6)" stroke-width="6"/>
    <circle r="100" fill="none" stroke="#7a5e0e" stroke-width="1"/>
    <!-- face -->
    <circle r="96" fill="url(#compassFace)"/>
    <!-- cardinal letters -->
    <text x="0" y="-72" font-family="serif" font-size="16" text-anchor="middle" fill="#e6c25e" font-weight="bold">N</text>
    <text x="76" y="6" font-family="serif" font-size="14" text-anchor="middle" fill="#cbb98c">E</text>
    <text x="0" y="84" font-family="serif" font-size="14" text-anchor="middle" fill="#cbb98c">S</text>
    <text x="-76" y="6" font-family="serif" font-size="14" text-anchor="middle" fill="#cbb98c">W</text>
    <!-- ticks -->
    <g stroke="#a17b1d" stroke-width="1.5">
      <line transform="rotate(0)" x1="0" y1="-90" x2="0" y2="-82"/>
      <line transform="rotate(45)" x1="0" y1="-90" x2="0" y2="-84"/>
      <line transform="rotate(90)" x1="0" y1="-90" x2="0" y2="-82"/>
      <line transform="rotate(135)" x1="0" y1="-90" x2="0" y2="-84"/>
      <line transform="rotate(180)" x1="0" y1="-90" x2="0" y2="-82"/>
      <line transform="rotate(225)" x1="0" y1="-90" x2="0" y2="-84"/>
      <line transform="rotate(270)" x1="0" y1="-90" x2="0" y2="-82"/>
      <line transform="rotate(315)" x1="0" y1="-90" x2="0" y2="-84"/>
    </g>
    <!-- compass rose (8-point star) -->
    <g>
      <polygon points="0,-60 8,0 0,60 -8,0" fill="#cbb98c"/>
      <polygon points="-60,0 0,-8 60,0 0,8" fill="#a99771"/>
      <polygon points="0,-60 6,0 -6,0" fill="#f3e6c3"/>
      <polygon points="0,60 6,0 -6,0" fill="#7a5e0e"/>
      <polygon points="-42,-42 0,-6 6,0 -6,0" fill="#cbb98c" opacity="0.6"/>
      <polygon points="42,-42 -6,0 6,0 0,-6" fill="#cbb98c" opacity="0.6"/>
      <polygon points="42,42 -6,0 6,0 0,6" fill="#7a5e0e" opacity="0.6"/>
      <polygon points="-42,42 -6,0 6,0 0,6" fill="#7a5e0e" opacity="0.6"/>
    </g>
    <!-- needle -->
    <g transform="rotate(28)">
      <polygon points="0,-78 5,0 0,78 -5,0" fill="#d05a3c"/>
      <polygon points="0,-78 5,0 -5,0" fill="#f3e6c3"/>
    </g>
    <circle r="6" fill="url(#brass6)" stroke="#1a0e07" stroke-width="1"/>
  </g>
  <text x="200" y="285" font-family="serif" font-size="11" letter-spacing="4" text-anchor="middle" fill="#cbb98c">CHART YOUR OWN COURSE</text>
  <rect x="6" y="6" width="388" height="288" fill="none" stroke="rgba(230,194,94,.35)" stroke-width="1"/>
</svg>
