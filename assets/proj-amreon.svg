<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="amBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1014"/>
      <stop offset="100%" stop-color="#16181d"/>
    </linearGradient>
    <radialGradient id="amGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(187,255,102,.18)"/>
      <stop offset="100%" stop-color="rgba(187,255,102,0)"/>
    </radialGradient>
    <linearGradient id="amPhone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1d23"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>
    <pattern id="amDots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="rgba(255,255,255,.07)"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#amBg)"/>
  <rect width="400" height="300" fill="url(#amDots)"/>
  <circle cx="200" cy="150" r="160" fill="url(#amGlow)"/>

  <!-- phone -->
  <g transform="translate(200 150)">
    <rect x="-66" y="-105" width="132" height="210" rx="18" fill="url(#amPhone)" stroke="#22252c" stroke-width="2"/>
    <rect x="-56" y="-92" width="112" height="184" rx="6" fill="#0a0b0e"/>
    <!-- notch -->
    <rect x="-16" y="-92" width="32" height="6" rx="3" fill="#16181d"/>

    <!-- header -->
    <text x="-46" y="-72" font-family="JetBrains Mono, monospace" font-size="6" fill="#7a7d85">AMREON</text>
    <circle cx="46" cy="-74" r="3" fill="#bbff66"/>

    <!-- heart ring -->
    <g transform="translate(0 -36)">
      <circle r="28" fill="none" stroke="#22252c" stroke-width="3"/>
      <path d="M -22 0 A 22 22 0 0 1 22 0" fill="none" stroke="#bbff66" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="2" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#e8e9ec">72%</text>
      <text x="0" y="12" font-family="JetBrains Mono, monospace" font-size="4" text-anchor="middle" fill="#7a7d85">HEALTH</text>
    </g>

    <!-- ecg line -->
    <polyline points="-50,5 -36,5 -28,-8 -20,20 -10,-14 -2,6 8,6 16,-4 24,14 34,6 50,6"
      fill="none" stroke="#bbff66" stroke-width="1.5" stroke-linecap="round"/>

    <!-- stat cards -->
    <g transform="translate(-46 18)">
      <rect width="40" height="28" rx="4" fill="#16181d" stroke="rgba(187,255,102,.2)" stroke-width="0.8"/>
      <text x="4" y="9" font-family="JetBrains Mono, monospace" font-size="4" fill="#7a7d85">STEPS</text>
      <text x="4" y="20" font-family="Space Grotesk, sans-serif" font-size="9" font-weight="700" fill="#e8e9ec">8.4k</text>
    </g>
    <g transform="translate(6 18)">
      <rect width="40" height="28" rx="4" fill="#16181d" stroke="rgba(255,217,102,.25)" stroke-width="0.8"/>
      <text x="4" y="9" font-family="JetBrains Mono, monospace" font-size="4" fill="#7a7d85">SLEEP</text>
      <text x="4" y="20" font-family="Space Grotesk, sans-serif" font-size="9" font-weight="700" fill="#e8e9ec">7h 12</text>
    </g>

    <!-- chart -->
    <g transform="translate(-50 58)">
      <line x1="0" y1="30" x2="100" y2="30" stroke="#22252c" stroke-width="0.5"/>
      <polyline points="0,22 16,18 32,20 48,12 64,16 80,8 100,12"
        fill="none" stroke="#bbff66" stroke-width="1.4"/>
      <circle cx="100" cy="12" r="2.4" fill="#bbff66"/>
    </g>

    <!-- bottom bar -->
    <rect x="-10" y="90" width="20" height="2.6" rx="1.3" fill="#7a7d85"/>
  </g>

  <!-- corner label -->
  <text x="20" y="30" font-family="JetBrains Mono, monospace" font-size="9" fill="#bbff66" font-weight="700">// amreon</text>
  <text x="20" y="280" font-family="JetBrains Mono, monospace" font-size="8" fill="#7a7d85">ai health platform</text>
</svg>
