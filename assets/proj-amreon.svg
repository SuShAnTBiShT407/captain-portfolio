<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="amPage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0f14"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>
    <radialGradient id="amHero" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="rgba(187,255,102,.22)"/>
      <stop offset="60%" stop-color="rgba(187,255,102,.04)"/>
      <stop offset="100%" stop-color="rgba(187,255,102,0)"/>
    </radialGradient>
    <pattern id="amDots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.6" fill="rgba(255,255,255,.07)"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="400" height="300" fill="#16181d"/>

  <!-- browser window -->
  <g transform="translate(16 24)">
    <!-- shadow -->
    <rect x="2" y="6" width="368" height="262" rx="10" fill="rgba(0,0,0,.5)"/>
    <!-- window body -->
    <rect width="368" height="260" rx="10" fill="url(#amPage)" stroke="#22252c" stroke-width="1"/>

    <!-- browser chrome bar -->
    <g>
      <rect width="368" height="34" rx="10" fill="#111316"/>
      <rect y="24" width="368" height="10" fill="#111316"/>
      <line x1="0" y1="34" x2="368" y2="34" stroke="#22252c" stroke-width="0.8"/>
      <!-- traffic lights -->
      <circle cx="16" cy="17" r="5" fill="#ff5f57"/>
      <circle cx="32" cy="17" r="5" fill="#ffbd2e"/>
      <circle cx="48" cy="17" r="5" fill="#28c840"/>
      <!-- url bar -->
      <rect x="80" y="8" width="200" height="18" rx="9" fill="#0a0b0e" stroke="#22252c" stroke-width="0.8"/>
      <text x="92" y="20" font-family="JetBrains Mono, monospace" font-size="8" fill="#7a7d85">🔒  amreon.com</text>
      <!-- tabs/buttons on right -->
      <circle cx="298" cy="17" r="2" fill="#7a7d85"/>
      <circle cx="306" cy="17" r="2" fill="#7a7d85"/>
      <circle cx="314" cy="17" r="2" fill="#7a7d85"/>
      <rect x="332" y="11" width="24" height="12" rx="3" fill="#bbff66"/>
      <text x="344" y="20" font-family="Inter, sans-serif" font-size="6" font-weight="700" text-anchor="middle" fill="#0a0b0e">try</text>
    </g>

    <!-- page content -->
    <g transform="translate(0 36)">
      <!-- dot grid background -->
      <rect width="368" height="224" fill="url(#amDots)"/>
      <!-- hero glow -->
      <rect width="368" height="160" fill="url(#amHero)"/>

      <!-- top nav of the website -->
      <g transform="translate(16 14)">
        <text x="0" y="8" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="700" fill="#bbff66">amreon</text>
        <circle cx="44" cy="5" r="2" fill="#bbff66"/>
        <g font-family="JetBrains Mono, monospace" font-size="6" fill="#7a7d85">
          <text x="200" y="8">features</text>
          <text x="240" y="8">how it works</text>
          <text x="290" y="8">about</text>
        </g>
        <rect x="322" y="0" width="32" height="14" rx="3" fill="#bbff66"/>
        <text x="338" y="9" font-family="Inter, sans-serif" font-size="6" font-weight="700" text-anchor="middle" fill="#0a0b0e">sign up</text>
      </g>

      <!-- hero -->
      <g transform="translate(20 44)">
        <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="5" fill="#bbff66">// AI HEALTH PLATFORM</text>
        <text x="0" y="22" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700" fill="#e8e9ec">Your body, in</text>
        <text x="0" y="44" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700" fill="#bbff66">conversation.</text>
        <text x="0" y="60" font-family="JetBrains Mono, monospace" font-size="6" fill="#7a7d85">Track. Ask. Learn. An AI companion for your daily health.</text>
        <!-- cta buttons -->
        <rect x="0" y="68" width="60" height="18" rx="4" fill="#bbff66"/>
        <text x="30" y="80" font-family="Inter, sans-serif" font-size="7" font-weight="700" text-anchor="middle" fill="#0a0b0e">get started →</text>
        <rect x="66" y="68" width="58" height="18" rx="4" fill="none" stroke="#22252c" stroke-width="1"/>
        <text x="95" y="80" font-family="Inter, sans-serif" font-size="7" font-weight="500" text-anchor="middle" fill="#e8e9ec">watch demo</text>
      </g>

      <!-- floating dashboard card -->
      <g transform="translate(220 56)">
        <rect width="124" height="120" rx="6" fill="#111316" stroke="#22252c" stroke-width="0.8"/>
        <text x="8" y="14" font-family="JetBrains Mono, monospace" font-size="5" fill="#7a7d85">// daily summary</text>
        <!-- ring -->
        <g transform="translate(28 38)">
          <circle r="14" fill="none" stroke="#22252c" stroke-width="3"/>
          <path d="M -11 -8 A 14 14 0 1 1 11 -8" fill="none" stroke="#bbff66" stroke-width="3" stroke-linecap="round"/>
          <text x="0" y="2" font-family="Space Grotesk, sans-serif" font-size="8" font-weight="700" text-anchor="middle" fill="#e8e9ec">72</text>
        </g>
        <text x="52" y="32" font-family="JetBrains Mono, monospace" font-size="5" fill="#7a7d85">score</text>
        <text x="52" y="42" font-family="Space Grotesk, sans-serif" font-size="9" font-weight="700" fill="#e8e9ec">good day</text>
        <!-- chart -->
        <polyline points="8,82 22,76 36,80 50,68 64,72 78,60 92,66 106,54 116,58"
          fill="none" stroke="#bbff66" stroke-width="1.4"/>
        <line x1="8" y1="92" x2="116" y2="92" stroke="#22252c" stroke-width="0.5"/>
        <g font-family="JetBrains Mono, monospace" font-size="4" fill="#7a7d85">
          <text x="8" y="104">mon</text>
          <text x="34" y="104">wed</text>
          <text x="62" y="104">fri</text>
          <text x="92" y="104">sun</text>
        </g>
      </g>

      <!-- bottom strip of social proof -->
      <g transform="translate(16 196)">
        <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="5" fill="#4a4d55">trusted by 50+ early users · backed by an LLM oracle · live on vercel</text>
      </g>
    </g>
  </g>

  <!-- live tag -->
  <g transform="translate(364 14)">
    <rect x="-44" y="0" width="44" height="14" rx="7" fill="rgba(40,200,64,.15)" stroke="rgba(40,200,64,.4)" stroke-width="0.8"/>
    <circle cx="-34" cy="7" r="2.4" fill="#28c840"/>
    <text x="-28" y="10" font-family="JetBrains Mono, monospace" font-size="6" font-weight="700" fill="#28c840">LIVE</text>
  </g>
</svg>
