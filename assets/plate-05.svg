<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1424"/>
      <stop offset="50%" stop-color="#243b54"/>
      <stop offset="100%" stop-color="#3a5476"/>
    </linearGradient>
    <radialGradient id="moon5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(243,230,195,.9)"/>
      <stop offset="60%" stop-color="rgba(243,230,195,.2)"/>
      <stop offset="100%" stop-color="rgba(243,230,195,0)"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg5)"/>
  <!-- moon -->
  <circle cx="310" cy="70" r="50" fill="url(#moon5)"/>
  <circle cx="310" cy="70" r="22" fill="#f3e6c3"/>
  <circle cx="316" cy="66" r="18" fill="rgba(15,26,44,.18)"/>
  <!-- stars -->
  <g fill="#f3e6c3">
    <circle cx="40" cy="40" r="1.2"/><circle cx="80" cy="60" r="0.8"/>
    <circle cx="130" cy="35" r="1.4"/><circle cx="180" cy="55" r="0.9"/>
    <circle cx="230" cy="30" r="1.1"/><circle cx="60" cy="100" r="0.7"/>
    <circle cx="380" cy="40" r="1"/><circle cx="350" cy="120" r="1.3"/>
    <circle cx="20" cy="150" r="0.9"/><circle cx="280" cy="100" r="0.8"/>
  </g>
  <!-- distant mountains (back layer) -->
  <polygon points="0,200 50,140 100,170 150,120 220,160 280,130 340,170 400,140 400,300 0,300"
    fill="#1a2c44" opacity="0.85"/>
  <!-- mid mountains -->
  <polygon points="0,230 60,180 130,210 200,170 280,200 340,180 400,210 400,300 0,300"
    fill="#0f1f33" opacity="0.95"/>
  <!-- front mountains -->
  <polygon points="0,260 80,210 160,240 240,200 320,235 400,215 400,300 0,300"
    fill="#08111e"/>
  <!-- city lights at base -->
  <g fill="#e6c25e">
    <rect x="30" y="262" width="2" height="3"/>
    <rect x="70" y="266" width="2" height="3"/>
    <rect x="120" y="258" width="2" height="3"/>
    <rect x="155" y="270" width="2" height="3"/>
    <rect x="200" y="262" width="2" height="3"/>
    <rect x="240" y="266" width="2" height="3"/>
    <rect x="290" y="260" width="2" height="3"/>
    <rect x="340" y="268" width="2" height="3"/>
    <rect x="370" y="264" width="2" height="3"/>
  </g>
  <text x="200" y="289" font-family="serif" font-size="11" letter-spacing="4" text-anchor="middle" fill="#cbb98c">MOUNTAINS · NIGHT WATCH</text>
  <rect x="6" y="6" width="388" height="288" fill="none" stroke="rgba(230,194,94,.35)" stroke-width="1"/>
</svg>
